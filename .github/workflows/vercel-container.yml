name: Vercel container build check

on:
  push:
    branches:
      - vercel-preview-setup
  pull_request:
    branches:
      - vercel-preview-setup

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Vercel container image
        run: docker build --file Dockerfile.vercel --tag tribunebangla-preview:ci .
